name: Wave 9 Release Evidence

on:
  push:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Capture deterministic release evidence
        run: |
          python - <<'PY' | tee wave9-release-evidence.txt
          import importlib.util
          import sys
          from pathlib import Path

          from nolane_plan.hashing import digest
          from nolane_plan.wave9_chaos import run_wave9_chaos
          from nolane_plan.wave9_coverage import audit_repository_coverage
          from nolane_plan.wave9_differential import run_wave9_differential
          from nolane_plan.wave9_registry import validate_wave9_registry

          script = Path("scripts/wave9_mutation_gate.py").resolve()
          spec = importlib.util.spec_from_file_location("wave9_release_mutation_gate", script)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load Wave 9 mutation gate")
          gate = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = gate
          spec.loader.exec_module(gate)

          registry_digest = validate_wave9_registry()
          chaos = run_wave9_chaos()
          differential = run_wave9_differential()
          coverage = audit_repository_coverage()

          mutations = []
          for mutation in gate.MUTATIONS:
              outcome, detail = gate.run_mutation(mutation)
              mutations.append({
                  "mutant_id": mutation.mutant_id,
                  "name": mutation.name,
                  "target_invariant_id": mutation.target_invariant_id,
                  "outcome": outcome.value,
              })
              print(f"MUTATION {mutation.mutant_id} {outcome.value}")
              if outcome is not gate.ProbeOutcome.KILLED:
                  print(detail)

          conformance_payload = {
              "registry_digest": registry_digest,
              "chaos_digest": chaos.canonical_digest,
              "differential_digest": differential.canonical_digest,
              "mutations": tuple(
                  (row["mutant_id"], row["name"], row["target_invariant_id"], row["outcome"])
                  for row in mutations
              ),
          }
          conformance_digest = digest(conformance_payload)

          print(f"WAVE9_REGISTRY_DIGEST={registry_digest}")
          print(f"WAVE9_CHAOS={chaos.passed_count}/{chaos.case_count}")
          print(f"WAVE9_CHAOS_DIGEST={chaos.canonical_digest}")
          print(f"WAVE9_DIFFERENTIAL={differential.passed_count}/{differential.case_count}")
          print(f"WAVE9_DIFFERENTIAL_DIGEST={differential.canonical_digest}")
          print(f"WAVE9_MUTATIONS_CAUGHT={sum(row['outcome'] == 'KILLED' for row in mutations)}/{len(mutations)}")
          print(f"WAVE9_MUTATIONS_INVALID={sum(row['outcome'] == 'INVALID' for row in mutations)}")
          print(f"WAVE9_CONFORMANCE_DIGEST={conformance_digest}")
          print(f"WAVE9_COVERAGE_ROWS={coverage.row_count}")
          print(f"WAVE9_COVERAGE_GREEN={coverage.green_count}")
          print(f"WAVE9_COVERAGE_PARTIAL={coverage.partial_count}")
          print(f"WAVE9_COVERAGE_ORPHANS={coverage.orphan_count}")
          print(f"WAVE9_COVERAGE_EVIDENCE_FREE_GREEN={coverage.evidence_free_green_count}")
          print(f"WAVE9_COVERAGE_DIGEST={coverage.canonical_digest}")

          if (
              chaos.failed_count
              or differential.failed_count
              or not coverage.passed
              or any(row["outcome"] != "KILLED" for row in mutations)
          ):
              raise SystemExit(1)
          PY
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: wave9-release-evidence
          path: wave9-release-evidence.txt
          if-no-files-found: error
          retention-days: 7
