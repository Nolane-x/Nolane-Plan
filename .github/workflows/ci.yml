name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit and conformance tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unit-test-${{ matrix.python-version }}.log
      - name: Retain failing unit test transcript
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ matrix.python-version }}
          path: unit-test-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 7
      - name: Compile all modules
        run: python -m compileall -q src
      - name: Principal-scope conformance oracle
        run: python -m nolane_plan conformance
      - name: Wave 2 adversarial conformance
        run: python -m nolane_plan.wave2_conformance
      - name: Wave 3 adversarial conformance
        run: python -m nolane_plan.wave3_conformance
      - name: Wave 3 constitutional mutation gate
        run: python scripts/wave3_mutation_gate.py
      - name: Wave 4 adversarial conformance
        run: python -m nolane_plan.wave4_conformance
      - name: Wave 4 constitutional mutation gate
        run: python scripts/wave4_mutation_gate.py
      - name: Wave 5 adversarial conformance
        run: python -m nolane_plan.wave5_conformance
      - name: Wave 5 constitutional mutation gate
        run: python scripts/wave5_mutation_gate.py
      - name: Wave 6 adversarial conformance
        run: python -m nolane_plan.wave6_conformance
      - name: Wave 6 constitutional mutation gate
        run: python scripts/wave6_mutation_gate.py
      - name: Wave 7 adversarial conformance
        run: python -m nolane_plan.wave7_conformance
      - name: Wave 7 constitutional mutation gate
        run: python scripts/wave7_mutation_gate.py
      - name: End-to-end demo
        run: python -m nolane_plan demo --root .ci-demo
