name: CI

on:
  push:

permissions:
  contents: read

jobs:
  mutation-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Diagnose Wave 9 X01-X06
        id: diagnostic
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee wave9-mutation-diagnostic.log
          import importlib.util
          import sys
          from pathlib import Path

          script = Path("scripts/wave9_mutation_gate.py").resolve()
          spec = importlib.util.spec_from_file_location("wave9_mutation_gate_diagnostic", script)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load Wave 9 mutation gate")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          failures = []
          for mutation in module.MUTATIONS[:6]:
              outcome, detail = module.run_mutation(mutation)
              print(f"DIAGNOSTIC {mutation.mutant_id} {outcome.value}")
              if outcome is not module.ProbeOutcome.KILLED:
                  print(detail)
                  failures.append(mutation.mutant_id)
          print("DIAGNOSTIC_FAILURES=" + ",".join(failures))
          raise SystemExit(1 if failures else 0)
          PY
      - name: Upload mutation diagnostic transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave9-mutation-diagnostic
          path: wave9-mutation-diagnostic.log
          if-no-files-found: error
          retention-days: 7
