name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit and conformance tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unit-test-${{ matrix.python-version }}.log
      - name: Retain failing unit test transcript
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ matrix.python-version }}
          path: unit-test-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 7
      - name: Compile all modules
        run: python -m compileall -q src
      - name: Principal-scope conformance oracle
        run: python -m nolane_plan conformance
      - name: Wave 2 adversarial conformance
        run: python -m nolane_plan.wave2_conformance
      - name: Wave 3 adversarial conformance
        run: python -m nolane_plan.wave3_conformance
      - name: Wave 3 constitutional mutation gate
        run: python scripts/wave3_mutation_gate.py
      - name: Wave 4 adversarial conformance
        run: python -m nolane_plan.wave4_conformance
      - name: Wave 4 constitutional mutation gate
        run: python scripts/wave4_mutation_gate.py
      - name: Wave 5 adversarial conformance
        run: python -m nolane_plan.wave5_conformance
      - name: Wave 5 constitutional mutation gate
        run: python scripts/wave5_mutation_gate.py
      - name: Wave 6 adversarial conformance
        run: python -m nolane_plan.wave6_conformance
      - name: Wave 6 constitutional mutation gate
        run: python scripts/wave6_mutation_gate.py
      - name: Wave 7 adversarial conformance
        run: python -m nolane_plan.wave7_conformance
      - name: Wave 7 constitutional mutation gate
        run: python scripts/wave7_mutation_gate.py
      - name: Wave 8 conformance exhaustion
        run: python -m nolane_plan.wave8_conformance
      - name: Wave 8 constitutional mutation gate
        if: matrix.python-version == '3.11'
        run: python scripts/wave8_mutation_gate.py
      - name: Wave 8 final coverage audit
        run: python -m nolane_plan.wave8_coverage
      - name: Wave 9 registry integrity
        run: python -c "from nolane_plan.wave9_registry import validate_wave9_registry; print('WAVE9_REGISTRY_DIGEST=' + validate_wave9_registry())"
      - name: Wave 9 deterministic production-fault schedules
        run: python -m nolane_plan.wave9_chaos
      - name: Wave 9 differential equivalence
        run: python -m nolane_plan.wave9_differential
      - name: Wave 9 constitutional mutation diagnostic
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          script = Path("scripts/wave9_mutation_gate.py").resolve()
          spec = importlib.util.spec_from_file_location("wave9_mutation_gate_diagnostic", script)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load Wave 9 mutation gate")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          failures = []
          for mutation in module.MUTATIONS[:6]:
              outcome, detail = module.run_mutation(mutation)
              print(f"DIAGNOSTIC {mutation.mutant_id} {outcome.value}")
              if outcome is not module.ProbeOutcome.KILLED:
                  print(detail)
                  failures.append(mutation.mutant_id)
          print("DIAGNOSTIC_FAILURES=" + ",".join(failures))
          raise SystemExit(1 if failures else 0)
          PY
      - name: Wave 9 final coverage audit
        run: python -m nolane_plan.wave9_coverage
      - name: End-to-end demo
        run: python -m nolane_plan demo --root .ci-demo-wave9
