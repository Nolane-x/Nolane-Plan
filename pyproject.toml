[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nolane-plan"
version = "0.3.0a1"
description = "Proof-carrying strategic future-space runtime for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Nolane-x"}]
dependencies = []
keywords = ["ai-agents", "planning", "multi-agent", "verification", "runtime", "future-space"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
nolane-plan = "nolane_plan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
